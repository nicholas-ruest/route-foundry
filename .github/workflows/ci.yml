name: ci
on: [push, pull_request]
permissions: {contents: read}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: {components: rustfmt, clippy}
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-deny}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Bind evidence to exact candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node -e "const fs=require('fs');const p='evidence/prototype/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.tested_source_sha=process.env.CANDIDATE_SHA;m.source_sha=process.env.CANDIDATE_SHA;m.tested_at=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');const s='evidence/semantic-review.md';fs.writeFileSync(s,fs.readFileSync(s,'utf8').replace('CI_REBIND_REQUIRED',process.env.CANDIDATE_SHA))"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('evidence/prototype/manifest.json'));const s=fs.readFileSync('evidence/semantic-review.md','utf8');if(m.tested_source_sha!==process.env.CANDIDATE_SHA||m.source_sha!==process.env.CANDIDATE_SHA||!s.includes(process.env.CANDIDATE_SHA)||s.includes('CI_REBIND_REQUIRED'))process.exit(1);console.log('EXACT_SHA_EVIDENCE_PASS '+process.env.CANDIDATE_SHA)"
      - run: npx -y @redocly/cli@1.34.5 lint openapi.json
      - run: ./scripts/verify-prototype.sh
      - run: docker compose build
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-evidence-${{ github.sha }}
          path: |
            evidence/prototype
            evidence/semantic-review.md
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
