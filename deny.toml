[advisories]
version = 2
ignore = ["RUSTSEC-2025-0141"]
[licenses]
version = 2
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "CC0-1.0"]
